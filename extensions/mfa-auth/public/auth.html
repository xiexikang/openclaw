<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>身份验证</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    h1 {
      color: #333;
      font-size: 24px;
      margin-bottom: 10px;
    }
    p {
      color: #666;
      font-size: 14px;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .qr-container {
      background: #f5f5f5;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #qrcode img {
      max-width: 100%;
      height: auto;
    }
    .error {
      color: #e74c3c;
      font-size: 16px;
      padding: 20px;
      background: #fee;
      border-radius: 8px;
    }
    .loading {
      color: #667eea;
      font-size: 16px;
      padding: 40px 20px;
    }
    .tips {
      background: #f0f7ff;
      border-left: 4px solid #667eea;
      padding: 12px;
      text-align: left;
      border-radius: 4px;
      margin-top: 20px;
    }
    .tips h3 {
      color: #667eea;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .tips ul {
      list-style: none;
      padding: 0;
    }
    .tips li {
      color: #555;
      font-size: 13px;
      padding: 4px 0;
      padding-left: 20px;
      position: relative;
    }
    .tips li:before {
      content: "•";
      position: absolute;
      left: 0;
      color: #667eea;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>身份验证</h1>
    <p>请使用手机扫描下方二维码完成身份验证</p>
    <div class="qr-container">
      <div id="qrcode"></div>
    </div>
    <div class="tips">
      <h3>操作提示</h3>
      <ul>
        <li>打开相机或扫码应用</li>
        <li>对准二维码进行扫描</li>
        <li>在手机上完成验证</li>
      </ul>
    </div>
  </div>

  <script>
    function getUrlParameter(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    function generateQRCode() {
      const code = getUrlParameter('code');
      const qrcodeContainer = document.getElementById('qrcode');

      if (!code) {
        qrcodeContainer.innerHTML = '<div class="error">缺少二维码参数</div>';
        return;
      }

      qrcodeContainer.innerHTML = '<div class="loading">正在生成二维码...</div>';

      QRCode.toCanvas(code, { 
        width: 200,
        margin: 2,
        color: {
          dark: '#000000',
          light: '#FFFFFF'
        }
      }, function(error, canvas) {
        if (error) {
          qrcodeContainer.innerHTML = '<div class="error">二维码生成失败</div>';
          console.error(error);
          return;
        }
        qrcodeContainer.innerHTML = '';
        qrcodeContainer.appendChild(canvas);
      });
    }

    window.addEventListener('load', generateQRCode);
  </script>
</body>
</html>
